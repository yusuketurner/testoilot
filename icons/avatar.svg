      <stop offset=".5" stop-color="#ffe2bf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe2bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f6e"/>
      <stop offset=".55" stop-color="#2f6fb3"/>
      <stop offset="1" stop-color="#7fc3f0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0e6"/>
      <stop offset="1" stop-color="#fde0d0"/>
    </linearGradient>
    <clipPath id="c"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
