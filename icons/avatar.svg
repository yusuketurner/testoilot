<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="28%" r="85%">
      <stop offset="0" stop-color="#dff3f0"/>
      <stop offset=".55" stop-color="#9fd6cd"/>
      <stop offset="1" stop-color="#4f9e94"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9875c"/>
      <stop offset=".6" stop-color="#9a6a45"/>
      <stop offset="1" stop-color="#7d5235"/>
    </linearGradient>
    <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="0">
