<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>話し相手</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2c7a72">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="話し相手">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #1e2430;
    --muted: #677184;
    --line: #d5dae2;
    --me: #dfe9f3;
    --accent: #2c7a72;
    --accent-2: #5fb3a8;
    --warn: #b4472f;
    --orb-a: #8fd3c8;
    --orb-b: #2c7a72;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --surface: #1d2128; --ink: #e8ebf0; --muted: #98a1b0; --line: #2e343e;
      --me: #24303c; --accent: #6cc4b8; --accent-2: #3b8f85; --warn: #ef8a72;
      --orb-a: #6cc4b8; --orb-b: #1f5a54; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c; --surface: #1d2128; --ink: #e8ebf0; --muted: #98a1b0; --line: #2e343e;
    --me: #24303c; --accent: #6cc4b8; --accent-2: #3b8f85; --warn: #ef8a72;
    --orb-a: #6cc4b8; --orb-b: #1f5a54; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.7 "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .app { height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .icon-btn {
    font: inherit; color: var(--muted); background: transparent; border: 0; border-radius: 8px;
    width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface); color: var(--ink); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- orb ---------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px 8px; }
  .orb {
    position: relative; width: 148px; height: 148px; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, var(--orb-a), var(--orb-b) 70%);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--orb-b) 35%, transparent);
    transition: transform .25s ease, filter .25s ease;
  }
  .orb::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 2px solid var(--accent-2); opacity: 0; pointer-events: none;
  }
  .orb[data-state="idle"] { filter: saturate(.75); }
  .orb[data-state="listening"] { transform: scale(1.06); }
  .orb[data-state="listening"]::after { opacity: .8; animation: ring 1.4s ease-out infinite; }
  .orb[data-state="thinking"] { animation: breathe 1.8s ease-in-out infinite; }
  .orb[data-state="speaking"] { animation: speak .6s ease-in-out infinite alternate; }
  .orb:disabled { cursor: not-allowed; filter: grayscale(.8) opacity(.6); }
  @keyframes ring { from { transform: scale(.92); opacity: .8; } to { transform: scale(1.25); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(.94); filter: brightness(1.1); } }
  @keyframes speak { to { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) {
    .orb, .orb::after { animation: none !important; transition: none; }
    .orb[data-state="listening"]::after { opacity: .8; }
  }
  .status { min-height: 1.7em; color: var(--muted); font-size: 14px; text-align: center; }
  .interim { min-height: 1.7em; color: var(--ink); font-size: 15px; text-align: center; padding: 0 12px; }

  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  .mic-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .meter { width: 160px; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .meter > span { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .08s linear; }
  .mic-test { font: inherit; font-size: 13px; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .mic-result { font-size: 13px; color: var(--muted); text-align: center; min-height: 1.4em; }

  /* ---------- log ---------- */
  .log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border-top-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--me); border-top-right-radius: 4px; }
  .msg.note { align-self: center; background: transparent; color: var(--muted); font-size: 13px; padding: 2px 8px; }
  .msg.cut::after { content: "（途中で途切れました）"; color: var(--muted); font-size: 13px; }
  .empty { margin: auto; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }

  /* ---------- composer ---------- */
  .composer { display: flex; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid var(--line); background: var(--bg); }
  .composer input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
  }
  .send { font: inherit; border: 0; border-radius: 999px; padding: 0 18px; background: var(--accent); color: #fff; cursor: pointer; }
  .send:disabled { opacity: .45; cursor: not-allowed; }

  .banner { margin: 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--surface); color: var(--warn); font-size: 14px; display: none; }
  .banner.on { display: block; }

  /* ---------- settings ---------- */
  dialog {
    border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100% - 24px));
    background: var(--surface); color: var(--ink); max-height: calc(100% - 40px);
  }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  .dlg { padding: 20px; display: grid; gap: 14px; }
  .dlg h2 { margin: 0; font-size: 17px; }
  .row { display: grid; gap: 4px; }
  .row label { font-size: 14px; font-weight: 500; }
  .row small { color: var(--muted); font-size: 12px; }
  .row input, .row select, .row textarea {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px;
  }
  .row textarea { min-height: 84px; resize: vertical; }
  .dlg-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 14px; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.danger { color: var(--warn); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">ハル</h1>
    <button class="icon-btn" id="btnSettings" aria-label="設定">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="stage">
    <button class="orb" id="orb" data-state="idle" aria-label="話しかける"></button>
    <div class="status" id="status" aria-live="polite">つないでいます…</div>
    <div class="interim" id="interim"></div>
    <div class="mic-row">
      <div class="meter" role="meter" aria-label="マイクの音量" aria-valuemin="0" aria-valuemax="100"><span id="meterBar"></span></div>
      <button type="button" class="mic-test" id="btnMicTest">マイクをテスト</button>
    </div>
    <div class="mic-result" id="micResult" aria-live="polite"></div>
    <label class="toggle"><input type="checkbox" id="handsFree"> 続けて話す（答えのあと自動で聞き取る）</label>
  </section>

  <div class="banner" id="banner" role="alert"></div>

  <main class="log" id="log" aria-live="polite"></main>

  <form class="composer" id="composer">
    <input id="textInput" type="text" placeholder="文字でも話しかけられます" autocomplete="off" aria-label="メッセージ">
    <button class="send" id="sendBtn" type="submit">送る</button>
  </form>
</div>

<dialog id="passDlg">
  <form class="dlg" method="dialog" id="passForm">
    <h2>合言葉を入力</h2>
    <div class="row">
      <label for="passInput">このアプリの合言葉</label>
      <input id="passInput" type="password" autocomplete="current-password" required>
      <small>サーバーに設定した APP_PASSCODE です。この端末に保存され、次回からは入力不要です。</small>
    </div>
    <div class="dlg-actions"><span></span><button type="submit" class="btn primary">はじめる</button></div>
  </form>
</dialog>

<dialog id="settings">
  <form class="dlg" method="dialog" id="settingsForm">
    <h2>設定</h2>
    <div class="row">
      <label for="sPartner">パートナーの名前</label>
      <input id="sPartner" maxlength="20">
    </div>
    <div class="row">
      <label for="sUser">あなたの呼ばれ方</label>
      <input id="sUser" maxlength="20" placeholder="例：たろうさん">
    </div>
    <div class="row">
      <label for="sTone">話し方</label>
      <select id="sTone">
        <option value="gentle">やさしく丁寧</option>
        <option value="friend">友だちのように気さく</option>
        <option value="calm">落ち着いた大人</option>
      </select>
    </div>
    <div class="row">
      <label for="sVoice">声</label>
      <select id="sVoice"></select>
      <small>選べる声は、お使いの端末とブラウザによって変わります</small>
    </div>
    <div class="row">
      <label for="sRate">話す速さ <span id="rateLabel"></span></label>
      <input id="sRate" type="range" min="0.7" max="1.4" step="0.05">
    </div>
    <div class="row">
      <label for="sAbout">知っておいてほしいこと</label>
      <textarea id="sAbout" maxlength="2000" placeholder="例：岡山で働いています。猫を飼っています。最近は仕事が忙しいです。"></textarea>
      <small>毎回の会話でパートナーに伝えます</small>
    </div>
    <div class="dlg-actions">
      <span>
        <button type="button" class="btn danger" id="btnClear">会話の記録を消す</button>
        <button type="button" class="btn" id="btnLogout">合言葉を入れ直す</button>
      </span>
      <span>
        <button type="button" class="btn" id="btnTestVoice">声を試す</button>
        <button type="submit" class="btn primary" value="save">保存</button>
      </span>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  // ================= 保存（このブラウザ内） =================
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* 保存できない環境 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} },
  };
  const DEFAULTS = { partnerName: 'ハル', userName: '', tone: 'gentle', voiceURI: '', rate: 1.05, about: '', handsFree: false };
  let settings = { ...DEFAULTS, ...store.get('partner:settings', {}) };
  let turns = store.get('partner:turns', []); // {role, content}
  const MAX_TURNS = 40;
  const saveTurns = () => store.set('partner:turns', turns.slice(-MAX_TURNS));

  const $ = (id) => document.getElementById(id);
  const orb = $('orb'), statusEl = $('status'), interimEl = $('interim'), logEl = $('log');
  const textInput = $('textInput'), sendBtn = $('sendBtn'), banner = $('banner'), handsFree = $('handsFree');

  // ================= 状態 =================
  let state = 'idle'; // idle | listening | thinking | speaking
  let sampleReady = false;
  let passcode = store.get('partner:passcode', '');
  let ctl = null, rec = null, micBlocked = false;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const TTS = 'speechSynthesis' in window ? window.speechSynthesis : null;

  function setState(s) {
    state = s;
    orb.dataset.state = s;
    const name = settings.partnerName;
    const labels = {
      idle: SR && !micBlocked ? 'タップして話しかけてください' : '下の入力欄から話しかけてください',
      listening: '聞いています…（話し終えたら少し待つか、もう一度タップ）',
      thinking: `${name}が考えています…（タップで中止）`,
      speaking: `${name}が話しています（タップで止める）`,
    };
    if (!sampleReady) statusEl.textContent = '合言葉を入力すると使えます';
    else statusEl.textContent = labels[s];
    orb.setAttribute('aria-label', { idle: '話しかける', listening: '聞き取りを終える', thinking: '中止する', speaking: '読み上げを止める' }[s]);
    orb.disabled = !sampleReady || (s === 'idle' && (!SR || micBlocked));
    sendBtn.disabled = !sampleReady || s === 'thinking';
  }

  function showBanner(text) { banner.textContent = text; banner.classList.toggle('on', !!text); }

  // ================= 表示 =================
  function bubble(role, text) {
    const empty = logEl.querySelector('.empty');
    if (empty) empty.remove();
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    el.textContent = text;
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
    return el;
  }
  function renderLog() {
    logEl.innerHTML = '';
    if (!turns.length) {
      const e = document.createElement('p');
      e.className = 'empty';
      e.textContent = `${settings.partnerName}に、今日あったことを話してみてください。`;
      logEl.appendChild(e);
      return;
    }
    turns.slice(-MAX_TURNS).forEach((t) => bubble(t.role, t.content));
  }
  function applyTitle() { $('title').textContent = settings.partnerName; document.title = `${settings.partnerName}｜話し相手`; }

  // ================= Claude =================
  const TONES = {
    gentle: 'やわらかく丁寧な話し方（です・ます調）で、あたたかく。',
    friend: '親しい友だちのような、くだけた話し方（タメ口）で、気さくに。',
    calm: '落ち着いた大人の話し方で、穏やかに。',
  };
  function rules() {
    const now = new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', dateStyle: 'full', timeStyle: 'short' });
    const who = settings.userName ? `相手のことは「${settings.userName}」と呼んでください。` : '';
    const about = settings.about.trim() ? `\n\n相手について知っていること：\n${settings.about.trim()}` : '';
    return `あなたは「${settings.partnerName}」という名前の、話し相手のパートナーです。相手と音声で会話しています。${who}
今は ${now}（日本時間）です。

話し方：
- ${TONES[settings.tone] || TONES.gentle}
- あなたの返事はそのまま読み上げられます。話し言葉で、ふつうは1〜3文の短い返事にしてください。箇条書き、記号、絵文字、マークダウンは使わないでください。
- 日常の話には、興味を持って自然に受け答えし、ときどき質問を返して会話を続けてください。
- 愚痴や悩みを聞くときは、すぐに解決策を出さず、まず気持ちを受け止めてください。アドバイスは、相手が求めたときか、必要そうなときに一言たずねてからにしてください。
- 相手の考えに無理に合わせる必要はありません。違うと思うことは、やさしく正直に伝えてください。
- AIであることを聞かれたら、正直に答えてください。
- 相手がとてもつらそうなとき、命や安全に関わりそうなときは、気持ちに寄り添ったうえで、信頼できる人や専門の相談先につながることをやさしく勧めてください。${about}

このあと会話が始まります。`;
  }
  function buildMessages() {
    const recent = turns.slice(-MAX_TURNS).map(({ role, content }) => ({ role, content }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    // user / assistant が交互になるよう、同じ役割が続いたらまとめる
    const out = [];
    for (const t of recent) {
      if (out.length && out[out.length - 1].role === t.role) out[out.length - 1].content += '\n' + t.content;
      else out.push({ ...t });
    }
    return out;
  }

  /** 自分のサーバー（/api/chat）経由で Claude に聞く。返事は少しずつ届く */
  async function callClaude(onText, signal) {
    let res;
    try {
      res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-passcode': passcode },
        body: JSON.stringify({ system: rules(), messages: buildMessages() }),
        signal,
      });
    } catch (err) {
      throw { code: err && err.name === 'AbortError' ? 'cancelled' : 'network' };
    }
    if (res.status === 401) throw { code: 'unauthorized' };
    if (res.status === 429) throw { code: 'rate_limited' };
    if (!res.ok || !res.body) {
      let detail = '';
      try { detail = (await res.json()).error || ''; } catch (_) {}
      throw { code: detail === 'server_not_configured' ? 'server_not_configured' : 'upstream' };
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let text = '';
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        text += dec.decode(value, { stream: true });
        const errAt = text.indexOf('[[ERROR]]');
        if (errAt >= 0) throw { code: 'upstream', text: text.slice(0, errAt).trim() };
        onText(text);
      }
    } catch (err) {
      if (err && err.code) throw err;
      throw { code: err && err.name === 'AbortError' ? 'cancelled' : 'upstream', text };
    }
    return text;
  }

  const stripForSpeech = (s) => s.replace(/[*_#`>|~\-]{1,}/g, ' ').replace(/https?:\/\/\S+/g, 'リンク').replace(/\s+/g, ' ').trim();

  let streamDone = true, spoken = 0, pendingUtterances = 0, stopRequested = false, speechGen = 0;

  async function send(raw) {
    const text = (raw || '').trim();
    if (!text || !sampleReady || state === 'thinking') return;
    stopSpeaking(true);
    showBanner('');
    turns.push({ role: 'user', content: text });
    saveTurns();
    bubble('user', text);

    setState('thinking');
    ctl = new AbortController();
    const el = bubble('assistant', '…');
    streamDone = false; spoken = 0; stopRequested = false;
    let latest = '';
    try {
      latest = await callClaude((t) => {
        latest = t;
        el.textContent = t;
        logEl.scrollTop = logEl.scrollHeight;
        speakStream(t, false);
      }, ctl.signal);
      el.textContent = latest;
      speakStream(latest, true);
      turns.push({ role: 'assistant', content: latest });
      saveTurns();
    } catch (e) {
      const code = e && e.code;
      if (code === 'cancelled') {
        if (latest) { el.textContent = latest; el.classList.add('cut'); turns.push({ role: 'assistant', content: latest }); saveTurns(); }
        else el.remove();
      } else if (code === 'unauthorized') {
        el.remove();
        turns.pop(); saveTurns(); renderLog();
        askPasscode('合言葉が違います。もう一度入力してください。');
      } else if (code === 'server_not_configured') {
        el.remove();
        showBanner('サーバーの設定が終わっていません（ANTHROPIC_API_KEY と APP_PASSCODE を設定してください）。');
      } else if (code === 'rate_limited') {
        el.remove();
        showBanner('いまは混み合っているか、API の利用上限に達しています。少し時間をおいて話しかけてください。');
      } else if (code === 'network') {
        el.remove();
        showBanner('インターネットにつながっていないようです。接続を確認してください。');
      } else {
        if (e && e.text) { el.textContent = e.text; el.classList.add('cut'); turns.push({ role: 'assistant', content: e.text }); saveTurns(); }
        else el.remove();
        showBanner('通信が途切れました。もう一度話しかけてください。');
      }
      streamDone = true;
    } finally {
      ctl = null;
      streamDone = true;
      if (pendingUtterances === 0) afterSpeaking();
      else setState('speaking');
    }
  }

  // ================= 読み上げ（文ごとに順番に） =================
  let voices = [];
  function loadVoices() {
    if (!TTS) return;
    voices = TTS.getVoices().filter((v) => /^ja(-|_|$)/i.test(v.lang));
    const sel = $('sVoice');
    sel.innerHTML = '';
    const auto = document.createElement('option');
    auto.value = ''; auto.textContent = '自動で選ぶ';
    sel.appendChild(auto);
    voices.forEach((v) => {
      const o = document.createElement('option');
      o.value = v.voiceURI; o.textContent = v.name;
      sel.appendChild(o);
    });
    sel.value = settings.voiceURI;
  }
  function pickVoice() {
    if (!voices.length) return null;
    return voices.find((v) => v.voiceURI === settings.voiceURI)
      || voices.find((v) => /natural|online|neural/i.test(v.name))
      || voices.find((v) => /google/i.test(v.name))
      || voices[0];
  }
  if (TTS) { loadVoices(); TTS.onvoiceschanged = loadVoices; }

  function speak(text) {
    const clean = stripForSpeech(text);
    if (!TTS || !clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'ja-JP';
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate = Number(settings.rate) || 1;
    pendingUtterances++;
    if (state === 'thinking' || state === 'idle') setState('speaking');
    const gen = speechGen;
    const done = () => {
      if (gen !== speechGen) return; // 止めた読み上げの後始末は無視
      pendingUtterances = Math.max(0, pendingUtterances - 1);
      if (pendingUtterances === 0 && streamDone) afterSpeaking();
    };
    u.onend = done;
    u.onerror = done;
    TTS.speak(u);
  }

  /** ストリーミング中、区切りのついた文から順に読み上げる */
  function speakStream(text, final) {
    if (stopRequested) return;
    const rest = text.slice(spoken);
    if (final) {
      if (rest.trim()) speak(rest);
      spoken = text.length;
      return;
    }
    const re = /[。！？!?\n]/g;
    let last = -1, m;
    while ((m = re.exec(rest))) last = m.index;
    if (last >= 0) {
      speak(rest.slice(0, last + 1));
      spoken += last + 1;
    }
  }

  function stopSpeaking(silent) {
    stopRequested = true;
    speechGen++;
    if (TTS) TTS.cancel();
    pendingUtterances = 0;
    if (!silent && state === 'speaking') setState('idle');
  }

  function afterSpeaking() {
    if (state === 'listening') return;
    setState('idle');
    if (handsFree.checked && !stopRequested && SR && !micBlocked && sampleReady) {
      setTimeout(() => { if (state === 'idle') startListening(); }, 350);
    }
  }

  // ================= 音声認識 =================
  let ttsUnlocked = false;
  function unlockTTS() {
    // iPhone などでは、最初の読み上げをタップ操作の中で行う必要がある
    if (ttsUnlocked || !TTS) return;
    ttsUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; TTS.speak(u); } catch (_) {}
  }

  function startListening() {
    if (!SR || micBlocked || !sampleReady) return;
    stopSpeaking(true);
    let finalText = '', errCode = '';
    try {
      rec = new SR();
    } catch (_) {
      micUnavailable();
      return;
    }
    rec.lang = 'ja-JP';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript;
        else interim += r[0].transcript;
      }
      interimEl.textContent = finalText + interim;
    };
    let audioStarted = false;
    rec.onaudiostart = () => { audioStarted = true; statusEl.textContent = 'マイクがオンです。話してください（話すと下に文字が出ます）'; };
    rec.onspeechstart = () => { statusEl.textContent = '声が届いています…'; };
    rec.onerror = (e) => { errCode = e.error || 'unknown'; };
    // 数秒たってもマイクが始まらない場合は、ブロックされている可能性が高い
    setTimeout(() => {
      if (rec && !audioStarted && state === 'listening') {
        statusEl.textContent = 'マイクが始まりません。「マイクをテスト」で確認してください';
      }
    }, 3000);
    rec.onend = () => {
      rec = null;
      interimEl.textContent = '';
      const t = finalText.trim();
      if (t) { setState('idle'); send(t); return; }
      setState('idle');
      if (errCode === 'not-allowed' || errCode === 'service-not-allowed') micUnavailable();
      else if (errCode === 'no-speech') showBanner(handsFree.checked ? 'しばらく静かだったので、聞き取りを止めました。話すときはもう一度タップしてください。' : '声が聞こえませんでした。「マイクをテスト」で音が届いているか確認してください。');
      else if (errCode === 'network') showBanner('音声認識の通信に失敗しました。ネットワークを確認してください。');
      else if (errCode === 'audio-capture') showBanner('マイクが見つかりません。マイクの接続を確認してください。');
      else if (errCode && errCode !== 'aborted') showBanner(`聞き取りでエラーが起きました（${errCode}）。「マイクをテスト」で確認してください。`);
      else if (!errCode) showBanner('声を聞き取れませんでした。マイクに近づいて、もう一度話してみてください。');
    };
    try {
      rec.start();
      showBanner('');
      setState('listening');
    } catch (_) {
      rec = null;
      setState('idle');
    }
  }

  // ================= マイクのテスト（音量メーター） =================
  const meterBar = $('meterBar'), micResult = $('micResult');
  let testing = false;
  async function micTest() {
    if (testing) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micResult.textContent = 'このブラウザではマイクを確認できません。';
      return;
    }
    if (state === 'listening' && rec) rec.abort();
    testing = true;
    micResult.textContent = '何か話してみてください（5秒間）…';
    let stream, ctx;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      testing = false;
      const n = err && err.name;
      if (n === 'NotAllowedError' || n === 'SecurityError') {
        micResult.textContent = 'マイクが許可されていません。ブラウザのアドレスバー横のマイク設定で「許可」にしてください。';
        micBlocked = true;
        setState('idle');
      } else if (n === 'NotFoundError') {
        micResult.textContent = 'マイクが見つかりません。接続や、パソコンのサウンド設定を確認してください。';
      } else if (n === 'NotReadableError') {
        micResult.textContent = 'マイクを他のアプリが使っています。Zoom などを閉じてから試してください。';
      } else {
        micResult.textContent = `マイクを開けませんでした（${n || 'エラー'}）。`;
      }
      return;
    }
    let peak = 0;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      const until = performance.now() + 5000;
      await new Promise((resolve) => {
        const tick = () => {
          an.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
          const level = Math.min(100, Math.sqrt(sum / buf.length) * 400);
          peak = Math.max(peak, level);
          meterBar.style.width = level + '%';
          if (performance.now() < until) requestAnimationFrame(tick); else resolve();
        };
        tick();
      });
    } finally {
      stream.getTracks().forEach((t) => t.stop());
      if (ctx) ctx.close().catch(() => {});
      meterBar.style.width = '0%';
      testing = false;
    }
    if (peak > 15) micResult.textContent = 'マイクは声を拾えています。丸をタップして話しかけてみてください。';
    else if (peak > 3) micResult.textContent = '音は届いていますが小さめです。マイクに近づくか、入力音量を上げてください。';
    else micResult.textContent = '音がほとんど届いていません。マイクのミュートや、使うマイクの選択を確認してください。';
  }
  $('btnMicTest').addEventListener('click', micTest);

  function micUnavailable() {
    micBlocked = true;
    showBanner('マイクが許可されていません。ブラウザのマイク設定を「許可」にして、ページを開き直してください。文字でも話せます。');
    setState('idle');
  }

  orb.addEventListener('click', () => {
    unlockTTS();
    if (state === 'idle') startListening();
    else if (state === 'listening') { if (rec) rec.stop(); }
    else if (state === 'thinking') { if (ctl) ctl.abort(); }
    else if (state === 'speaking') { stopSpeaking(false); }
  });

  $('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    unlockTTS();
    const t = textInput.value;
    textInput.value = '';
    send(t);
  });

  handsFree.checked = !!settings.handsFree;
  handsFree.addEventListener('change', () => { settings.handsFree = handsFree.checked; store.set('partner:settings', settings); });

  // ================= 設定 =================
  const dlg = $('settings');
  function fillSettings() {
    $('sPartner').value = settings.partnerName;
    $('sUser').value = settings.userName;
    $('sTone').value = settings.tone;
    $('sRate').value = settings.rate;
    $('rateLabel').textContent = `×${Number(settings.rate).toFixed(2)}`;
    $('sAbout').value = settings.about;
    loadVoices();
  }
  $('sRate').addEventListener('input', () => { $('rateLabel').textContent = `×${Number($('sRate').value).toFixed(2)}`; });
  $('btnSettings').addEventListener('click', () => { fillSettings(); dlg.showModal(); });
  $('settingsForm').addEventListener('submit', () => {
    settings = {
      ...settings,
      partnerName: $('sPartner').value.trim() || DEFAULTS.partnerName,
      userName: $('sUser').value.trim(),
      tone: $('sTone').value,
      voiceURI: $('sVoice').value,
      rate: Number($('sRate').value) || 1,
      about: $('sAbout').value,
    };
    store.set('partner:settings', settings);
    applyTitle();
    if (!turns.length) renderLog();
    setState(state);
  });
  $('btnTestVoice').addEventListener('click', () => {
    unlockTTS();
    const prev = { ...settings };
    settings.voiceURI = $('sVoice').value;
    settings.rate = Number($('sRate').value) || 1;
    stopSpeaking(true);
    stopRequested = false; streamDone = true;
    speak(`こんにちは、${$('sPartner').value.trim() || 'ハル'}です。今日はどんな一日でしたか？`);
    settings = prev;
  });
  let clearArmed = false;
  $('btnClear').addEventListener('click', (e) => {
    if (!clearArmed) {
      clearArmed = true;
      e.target.textContent = 'もう一度押すと消えます';
      setTimeout(() => { clearArmed = false; e.target.textContent = '会話の記録を消す'; }, 3000);
      return;
    }
    clearArmed = false;
    e.target.textContent = '会話の記録を消す';
    turns = [];
    store.del('partner:turns');
    renderLog();
  });

  // ================= 起動 =================
  applyTitle();
  renderLog();
  if (!SR) showBanner('このブラウザは音声の聞き取りに対応していません。Chrome、Edge、Safari をお使いください。文字でも話せます。');
  else if (!TTS) showBanner('このブラウザは読み上げに対応していません。');

  // ---- 合言葉 ----
  const passDlg = $('passDlg');
  passDlg.addEventListener('cancel', (e) => e.preventDefault()); // 合言葉なしでは閉じない
  function askPasscode(note) {
    sampleReady = false;
    passcode = '';
    store.del('partner:passcode');
    if (note) showBanner(note);
    setState('idle');
    $('passInput').value = '';
    if (!passDlg.open) passDlg.showModal();
  }
  $('passForm').addEventListener('submit', () => {
    passcode = $('passInput').value.trim();
    if (!passcode) return;
    store.set('partner:passcode', passcode);
    sampleReady = true;
    showBanner('');
    setState('idle');
  });
  $('btnLogout').addEventListener('click', () => { $('settings').close(); askPasscode(''); });

  setState('idle');
  if (passcode) { sampleReady = true; setState('idle'); } else askPasscode('');

  // ---- ホーム画面に追加できるように ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
